name: Deploy Cloudflare

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust rewriter tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          rustup toolchain install nightly --component rust-src
          rustup target add wasm32-unknown-unknown --toolchain nightly
          cargo install wasm-bindgen-cli --version 0.2.105 --locked
          cargo install wasm-snip --locked

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Pages assets
        env:
          SKIP_WASM_SNIP: "1"
        run: pnpm pages:build

      - name: Check Cloudflare secrets
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "::error::CLOUDFLARE_ACCOUNT_ID repository secret is not set" && exit 1)
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "::error::CLOUDFLARE_API_TOKEN repository secret is not set" && exit 1)

      - name: Deploy Worker
        run: pnpm dlx wrangler deploy --config cloudflare/worker/wrangler.toml

      - name: Deploy Pages
        run: pnpm dlx wrangler pages deploy cloudflare/pages --project-name y-proxy --branch main
